name: Prepare QR assets

on:
  push:
    paths:
      - "assets/qr.PNG"
      - "scripts/prepare-qr-assets.mjs"
      - ".github/workflows/prepare-qr-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-qr-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate display QR
        run: node scripts/prepare-qr-assets.mjs

      - name: Commit display QR
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: prepare qr display asset"
          file_pattern: assets/qr-display.png
